services:
  app:
    build:
      context: ../..
      dockerfile: cloud_app/bo_sung_tv4_app/Dockerfile
    ports:
      - "127.0.0.1:${TV4_PORT:-8080}:8080"
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      APP_ORIGIN: ${APP_ORIGIN:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}
    volumes:
      - tv4_data:/data
    restart: unless-stopped
  https:
    image: caddy:2
    profiles: [cloud]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  tv4_data:
  caddy_data:
  caddy_config:
